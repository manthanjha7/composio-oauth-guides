# Written by the agent (Claude) for the Flow E setup attempt.
# Import at https://api.slack.com/apps -> Create New App -> From a manifest.
# Replace the redirect URL with the callback URI shown in YOUR Composio dashboard
# (Auth Configs -> Create -> Slack -> use your own credentials).
display_information:
  name: Agent Setup Test
  description: Test app for an AI agent that reads channels and posts replies.
  background_color: "#4f46e5"
features:
  bot_user:
    display_name: agent-setup-test
    always_online: false
oauth_config:
  redirect_urls:
    - https://REPLACE-WITH-COMPOSIO-CALLBACK-URI
  scopes:
    bot:
      - chat:write
      - channels:read
      - channels:history
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
